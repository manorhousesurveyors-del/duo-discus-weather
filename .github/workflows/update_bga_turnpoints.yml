name: Update BGA turnpoints

on:
  schedule:
    - cron: '0 6 1 */3 *' # 1 January, April, July, October at 06:00 UTC.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bga-turnpoints-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 · Node 24
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 · Node 24
        with:
          python-version: '3.12'
      - name: Test parser and update safeguards
        run: python -m unittest tests.test_bga_turnpoints -v
      - name: Fetch and validate a complete BGA catalog
        run: python bga_turnpoints.py --update
      - name: Validate saved catalog
        run: python bga_turnpoints.py
      - name: Commit changed data to main
        run: |
          git add -- data/bga_turnpoints.json
          if git diff --cached --quiet; then
            echo "BGA turnpoints unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh BGA turnpoints'
          # A concurrent main update stops this push safely; never force it.
          git push origin HEAD:main
