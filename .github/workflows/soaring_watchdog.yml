name: Soaring watchdog

on:
  schedule:
    - cron: '17 */6 * * *'  # 00:17, 06:17, 12:17, 18:17 UTC; GitHub may delay runs.
  workflow_dispatch:
    inputs:
      send:
        description: Send an immediate test email with the five-day star outlook (otherwise dry run)
        type: boolean
        default: false
      restore_run_id:
        description: Optional recovery run ID; unavailable or invalid state starts an empty ledger
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: soaring-watchdog-${{ github.repository }}
  cancel-in-progress: false

jobs:
  watchdog:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 · Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 · Node 24
        with:
          python-version: '3.12'
          cache: pip
      - name: Find durable alert state
        id: previous
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8 · Node 24
        env:
          RECOVERY_RUN_ID: ${{ inputs.restore_run_id }}
        with:
          script: |
            await require('./scripts/find_watchdog_state.js')({github, context, core});
      - name: Restore previous ledger
        if: steps.previous.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 · Node 24
        with:
          artifact-ids: ${{ steps.previous.outputs.artifact_id }}
          merge-multiple: true
          path: var/restored-state
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}
      - name: Validate or initialize ledger
        id: state
        run: |
          python scripts/watchdog_state.py prepare --restored var/restored-state/alerts.sqlite3
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate and dispatch
        env:
          SEND_NOTIFICATIONS: ${{ github.event_name == 'schedule' || inputs.send }}
          MANUAL_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send }}
          DUO_ALERT_CHANNELS: ${{ vars.DUO_ALERT_CHANNELS || 'email,ntfy,whatsapp' }}
          DUO_NTFY_TOPIC: ${{ vars.DUO_NTFY_TOPIC || 'g-ckml-soaring-alerts' }}
          DUO_EMAIL_TO: ${{ vars.DUO_EMAIL_TO || 'manorhousesurveyors@gmail.com' }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME || 'manorhousesurveyors@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DUO_WHATSAPP_TO: ${{ vars.DUO_WHATSAPP_TO || '+447976125887' }}
          WHATSAPP_PROVIDER: ${{ vars.WHATSAPP_PROVIDER || 'callmebot' }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ vars.TWILIO_WHATSAPP_FROM }}
          TWILIO_CONTENT_SID: ${{ vars.TWILIO_CONTENT_SID }}
        run: |
          if [ "$MANUAL_TEST_EMAIL" = "true" ]; then
            python alerts.py --test-email
          elif [ "$SEND_NOTIFICATIONS" = "true" ]; then
            python alerts.py --send
          else
            python alerts.py --dry-run
          fi
      - name: Make a consistent SQLite backup
        id: backup
        if: always() && steps.state.outcome == 'success'
        run: python scripts/watchdog_state.py backup
      - name: Persist delivery ledger even after send errors
        if: always() && steps.backup.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 · Node 24
        with:
          name: soaring-watchdog-state
          path: var/watchdog-state/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Save evaluation reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 · Node 24
        with:
          name: soaring-briefings-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/briefings/briefing-*.html
            var/briefings/briefing-*.json
          if-no-files-found: ignore
          retention-days: 14
