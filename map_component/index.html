<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body,#map-wrapper,#map,.folium-map{width:100%;height:680px!important;min-height:680px!important;margin:0;padding:0}
body{overflow:hidden;font-family:Arial,sans-serif}#status{padding:16px;background:#fdfbf7;color:#1e242b}
</style></head><body><div id="map-wrapper"><div id="status" role="status">Loading map…</div></div>
<script>
'use strict';
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
window.Streamlit={setComponentValue:value=>send('streamlit:setComponentValue',{value,dataType:'json'})};
window.__GLOBAL_DATA__={};
const load=(url,css)=>new Promise((resolve,reject)=>{const e=document.createElement(css?'link':'script');if(css){e.rel='stylesheet';e.href=url;}else e.src=url;e.onload=resolve;e.onerror=()=>{e.remove();reject(new Error('Asset unavailable'));};document.head.append(e);});
async function fallback(urls,css){for(const url of urls){try{await load(url,css);return;}catch(e){}}throw new Error('Map library unavailable. Reload or check your network.');}
const ready=Promise.all([
 fallback(['vendor/leaflet.css','https://unpkg.com/leaflet@1.9.4/dist/leaflet.css','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css'],true),
 fallback(['vendor/leaflet.js','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js']),
 fallback(['vendor/jquery.min.js','https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js','https://unpkg.com/jquery@3.7.1/dist/jquery.min.js'])
]);
// Keep decoded documents in this tab's memory across iframe remounts. Store
// strings/data only, never map objects, DOM nodes or listeners from another page.
let cacheHost=window;
try{if(parent.location.origin===location.origin)cacheHost=parent;}catch(_){}
const decodedMaps=cacheHost._duoDecodedMaps||(cacheHost._duoDecodedMaps=new Map());
function retainDocument(id,document,size){
 if(!id||size>48*1024*1024)return;
 decodedMaps.delete(id);decodedMaps.set(id,{document,size});
 let total=[...decodedMaps.values()].reduce((sum,item)=>sum+item.size,0);
 while(decodedMaps.size>4||total>48*1024*1024){const key=decodedMaps.keys().next().value;total-=decodedMaps.get(key).size;decodedMaps.delete(key);}
}
let previous='',generation=0,pendingId=null,pendingTask=null;const requestedDocuments=new Set();
window.addEventListener('message',async event=>{
 if(event.source!==parent||event.data.type!=='streamlit:render')return;
 const renderStarted=performance.now(),renderTiming={};
 let args=event.data.args;const signature=args.document_id||args.script;
 send('streamlit:setFrameHeight',{height:720});
 if(signature===previous){window.map_div?._duoAcceptTask?.(args.canonical_task);return;}
 const saved=decodedMaps.get(args.document_id);
 if(saved){args={...args,...saved.document};renderTiming.cacheHit=true;}
 if(!args.script&&!args.compressed_document){
  // An acknowledgement fragment can arrive during async decompression. It
  // must not cancel that newer document or start a redundant cache request.
  if(signature===pendingId){pendingTask=args.canonical_task;return;}
  if(args.document_id&&!requestedDocuments.has(args.document_id)){requestedDocuments.add(args.document_id);send('streamlit:setComponentValue',{value:{document_request:args.document_id},dataType:'json'});}
  return;
 }
 // Only a genuine replacement supersedes an in-flight render. An old-map
 // acknowledgement (the signature===previous return above) leaves it intact.
 const token=++generation;pendingId=signature;pendingTask=args.canonical_task;
 try{
  if(args.compressed_document&&!args.script){
   const cached=decodedMaps.get(args.document_id);
   if(cached){args={...args,...cached.document};renderTiming.cacheHit=true;}
   else{
    const raw=atob(args.compressed_document),bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    const source=await new Response(stream).text(),decoded=JSON.parse(source);
    retainDocument(args.document_id,decoded,source.length*2);args={...args,...decoded};
   }
  }
  renderTiming.decode=performance.now()-renderStarted;
  await ready;renderTiming.assets=performance.now()-renderStarted-renderTiming.decode;if(token!==generation)return;
  if(window.map_div?.remove)window.map_div.remove();
  document.getElementById('map-wrapper').innerHTML=args.header+args.html;
  window.__GLOBAL_DATA__={};
  const constructionStarted=performance.now();
  new Function(args.script)();previous=signature;
  window._duoRenderTiming={...renderTiming,construct:performance.now()-constructionStarted,total:performance.now()-renderStarted,readyAt:Date.now()};
  const map=window.map_div;map._duoAcceptTask?.(pendingTask);pendingId=null;pendingTask=null;
  requestedDocuments.delete(args.document_id);
  send('streamlit:setComponentValue',{value:{document_cache:[...decodedMaps.keys()]},dataType:'json'});
  map.on('click',e=>{if(map._duoClientClicks||performance.now()<(map._duoLocalClickUntil||0)||e.originalEvent?._duoSelected)return;
   const point={lat:e.latlng.lat,lng:e.latlng.lng};window.__GLOBAL_DATA__.lat_lng_clicked=point;
   if(!['wind','radar','thermal','pfd','xc','stf'].includes(map._duoMode))window.Streamlit.setComponentValue({last_clicked:point,last_object_clicked:null});
  });
 }catch(e){if(token!==generation)return;pendingId=null;pendingTask=null;document.getElementById('map-wrapper').innerHTML='<div id="status" role="alert">Map could not load. Please reload this page. '+String(e.message).replace(/[<>&]/g,'')+'</div>';console.error(e);}
});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:720});
</script></body></html>
